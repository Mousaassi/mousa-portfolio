هذه هي المشكلة: النوافذ المنبثقة (modals) تستخدم `visibility` و `opacity` ولكن بدون خلفية سوداء مرئية، كما أن `openEditor` تحاول الوصول إلى `DEFS` قبل تعريفه.

window._saveToFirebase=async()=>{

    const batch=writeBatch(db);

};

function ensureLO(v,d){if(v&&typeof v==='object'&&(v.en!==undefined||v.tr!==undefined||v.ar!==undefined))return{en:v.en||(d&&d.en)||'',tr:v.tr||(d&&d.tr)||'',ar:v.ar||(d&&d.ar)||''};if(typeof v==='string')return{en:v,tr:v,ar:v};if(d&&typeof d==='object')return{en:d.en||'',tr:d.tr||'',ar:d.ar||''};return{en:'',tr:'',ar:''};}
function deepMerge(fb,defs){
  const r={},h=fb.hero||{},dh=defs.hero||{};
  r.hero={firstName:h.firstName||dh.firstName||'Mousa',lastName:h.lastName||dh.lastName||'Assi',eyebrow:ensureLO(h.eyebrow,dh.eyebrow),subtitle:ensureLO(h.subtitle,dh.subtitle),desc:ensureLO(h.desc,dh.desc),tags:(h.tags&&h.tags.length)?h.tags:(dh.tags||[]),email:h.email||dh.email||'',phone:h.phone||dh.phone||'',location:h.location||dh.location||'',linkedin:h.linkedin||dh.linkedin||''};
  const t=fb.titles||{},dt=defs.titles||{};r.titles={};['edu','proj','exp','skills','certs'].forEach(k=>{r.titles[k]=ensureLO(t[k],dt[k]);});
  r.edu=(fb.edu&&fb.edu.length)?fb.edu.map(normEdu):defs.edu;r.proj=(fb.proj&&fb.proj.length)?fb.proj.map(normProj):defs.proj;r.exp=(fb.exp&&fb.exp.length)?fb.exp.map(normExp):defs.exp;r.skills=(fb.skills&&fb.skills.length)?fb.skills.map(normSkill):defs.skills;r.certs=(fb.certs&&fb.certs.length)?fb.certs.map(normCert):defs.certs;r.social=(fb.social&&fb.social.length)?fb.social:defs.social;r.custom=(fb.custom&&fb.custom.length)?fb.custom:defs.custom;
  return r;
}
function normBullets(a){if(!a||!a.length)return[{en:'',tr:'',ar:''}];return a.map(b=>{if(!b)return{en:'',tr:'',ar:''};if(typeof b==='string')return{en:b,tr:b,ar:b};return{en:b.en||'',tr:b.tr||'',ar:b.ar||''};});}
function normEdu(e){return{year:e.year||'',degree:ensureLO(e.degree,{en:'',tr:'',ar:''}),school:e.school||'',loc:e.loc||''};}
function normProj(p){return{year:p.year||'',title:ensureLO(p.title,{en:'',tr:'',ar:''}),bullets:normBullets(p.bullets),pdf:p.pdf||'',pdfName:p.pdfName||''};}

function normSkill(s){return{cat:ensureLO(s.cat,{en:'',tr:'',ar:''}),tags:s.tags||[],hl:s.hl||[]};}

.hero-desc{font-size:.94rem;color:var(--text-dim);line-height:1.85;max-width:540px;margin-bottom:28px;animation:slideInLeft .7s ease both .4s;}
.hero-tags{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:32px;animation:slideInLeft .7s ease both .5s;}
.tag{padding:5px 15px;border:1px solid var(--border);border-radius:50px;font-size:.78rem;color:var(--text-dim);font-family:var(--font-mono);transition:var(--trans);}
.tag:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px);}
.hero-links{display:flex;flex-wrap:wrap;gap:10px;align-items:center;animation:slideInLeft .7s ease both .6s;}
.contact-link{display:flex;align-items:center;gap:7px;color:var(--text-dim);text-decoration:none;font-size:.83rem;transition:var(--trans);padding:6px 12px;border:1px solid transparent;border-radius:50px;}
.contact-link:hover{color:var(--accent);border-color:var(--border);transform:translateY(-2px);}
.contact-link svg{width:14px;height:14px;flex-shrink:0;}
.social-link{display:flex;align-items:center;gap:7px;color:var(--text-dim);text-decoration:none;font-size:.83rem;transition:var(--trans);padding:6px 14px;border:1px solid var(--border);border-radius:50px;}
.social-link:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-2px);background:var(--glow);}
.social-link svg{width:14px;height:14px;flex-shrink:0;}
.links-div{width:1px;height:20px;background:var(--border);}

/* ══ SECTIONS ══ */
.section{padding:90px 48px;max-width:1200px;margin:0 auto;}
.section-header{display:flex;align-items:baseline;gap:20px;margin-bottom:50px;}
.section-num{font-family:var(--font-mono);font-size:.74rem;color:var(--accent);letter-spacing:.1em;}
.section-title{font-family:var(--font-display);font-size:clamp(1.8rem,3.5vw,2.6rem);font-weight:700;line-height:1;}
.section-line{flex:1;height:1px;background:var(--border);margin-left:20px;}
.section-divider{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);max-width:1200px;margin:0 auto;}

/* ══ EDUCATION ══ */
.edu-grid{display:grid;gap:18px;}
.edu-card{display:grid;grid-template-columns:auto 1fr;gap:0 26px;padding:22px 26px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);transition:var(--trans);}
.edu-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 32px rgba(0,0,0,.25),0 0 0 1px var(--accent);}
.edu-year{font-family:var(--font-mono);font-size:.7rem;color:var(--accent);writing-mode:vertical-rl;letter-spacing:.1em;opacity:.7;align-self:start;margin-top:3px;}
.edu-info h3{font-family:var(--font-display);font-size:1.08rem;font-weight:700;margin-bottom:4px;}
.edu-info .school{color:var(--accent);font-size:.86rem;font-weight:500;margin-bottom:3px;}
.edu-info .eloc{font-family:var(--font-mono);font-size:.7rem;color:var(--text-dimmer);}

/* ══ PROJECTS ══ */
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;}
.project-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;position:relative;overflow:hidden;transition:var(--trans);display:flex;flex-direction:column;}
.project-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent);opacity:0;transition:opacity .3s;}
.project-card:hover{border-color:var(--accent);transform:translateY(-5px);box-shadow:0 16px 48px rgba(0,0,0,.3);}
.project-card:hover::before{opacity:1;}

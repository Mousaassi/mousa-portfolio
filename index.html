<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mousa Assi — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
:root{
  --radius:14px;
  --font-display:'Playfair Display',serif;
  --font-body:'DM Sans',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --trans:all .28s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]  {--bg:#0a0a0f;--surface:#111118;--surface2:#1a1a26;--border:#2a2a40;--accent:#e8c87a;--accent2:#7a9ee8;--accent3:#e87a9e;--text:#e8e8f0;--text-dim:#8888a8;--text-dimmer:#55556a;--header-bg:rgba(10,10,15,.9);--glow:rgba(232,200,122,.12);}
[data-theme="light"] {--bg:#f5f4f0;--surface:#ffffff;--surface2:#f0ede8;--border:#d8d4cc;--accent:#b8860b;--accent2:#3a6ab8;--accent3:#c0305c;--text:#1a1814;--text-dim:#5a5650;--text-dimmer:#9a9690;--header-bg:rgba(245,244,240,.92);--glow:rgba(184,134,11,.08);}
[data-theme="navy"]  {--bg:#0d1b2a;--surface:#112236;--surface2:#163049;--border:#1e3a56;--accent:#64c8ff;--accent2:#7affd4;--accent3:#ff9f64;--text:#e0f0ff;--text-dim:#7aa8cc;--text-dimmer:#446688;--header-bg:rgba(13,27,42,.92);--glow:rgba(100,200,255,.10);}
[data-theme="forest"]{--bg:#0d1f0f;--surface:#122614;--surface2:#183220;--border:#264030;--accent:#7dd87a;--accent2:#a8d8a8;--accent3:#f0c060;--text:#e0f0e0;--text-dim:#7aaa7a;--text-dimmer:#446644;--header-bg:rgba(13,31,15,.92);--glow:rgba(125,216,122,.10);}
[data-theme="rose"]  {--bg:#1a0d14;--surface:#241018;--surface2:#30141e;--border:#481830;--accent:#f0a0c0;--accent2:#c080f0;--accent3:#f0d060;--text:#f8e8f0;--text-dim:#c08090;--text-dimmer:#805060;--header-bg:rgba(26,13,20,.92);--glow:rgba(240,160,192,.10);}
[data-theme="mono"]  {--bg:#111111;--surface:#1c1c1c;--surface2:#252525;--border:#333333;--accent:#eeeeee;--accent2:#aaaaaa;--accent3:#888888;--text:#eeeeee;--text-dim:#999999;--text-dimmer:#555555;--header-bg:rgba(17,17,17,.92);--glow:rgba(220,220,220,.06);}

@keyframes pageIn   {from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shimmer  {0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes float    {0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes sP       {0%,100%{opacity:.3}50%{opacity:1}}
@keyframes sF       {0%{opacity:1}70%{opacity:1}100%{opacity:0}}
@keyframes fbP      {0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin     {to{transform:rotate(360deg)}}
@keyframes slideUp  {from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes adminIn  {from{opacity:0;transform:translateY(-8px) scale(.96)}to{opacity:1;transform:none}}
@keyframes modalIn  {from{opacity:0}to{opacity:1}}
@keyframes pulse    {0%,100%{opacity:.5}50%{opacity:.85}}
@keyframes certIn   {from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
@keyframes borderRun{0%{background-position:0% 50%}100%{background-position:200% 50}}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg);color:var(--text);font-family:var(--font-body);
  min-height:100vh;overflow-x:hidden;
  transition:background .4s,color .4s;
  animation:pageIn .55s ease forwards;
}

/* ══ SYNC ══ */
.sync-bar{position:fixed;top:0;left:0;right:0;z-index:9998;height:3px;pointer-events:none;}
.sync-bar.loading{background:linear-gradient(90deg,transparent,var(--accent2),transparent);animation:sP 1.2s infinite;}
.sync-bar.saving {background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:sP .8s infinite;}
.sync-bar.synced {background:linear-gradient(90deg,transparent,#4ecb71,transparent);animation:sF 2.5s forwards;}
.sync-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--surface);border:1px solid var(--border);border-radius:50px;padding:8px 22px;font-family:var(--font-mono);font-size:.71rem;color:var(--text-dim);opacity:0;transition:all .3s;z-index:801;white-space:nowrap;pointer-events:none;max-width:90vw;overflow:hidden;text-overflow:ellipsis;}
.sync-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.sync-toast.synced{border-color:#4ecb71;color:#4ecb71;}
.sync-toast.error {border-color:#e87a7a;color:#e87a7a;}
.sync-toast.saving,.sync-toast.loading{border-color:var(--accent);color:var(--accent);}

/* ══ HEADER ══ */
header{position:fixed;top:0;left:0;right:0;z-index:900;display:flex;align-items:center;justify-content:space-between;padding:16px 48px;background:var(--header-bg);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);transition:background .4s,border-color .4s;}
.logo{font-family:var(--font-display);font-size:1.4rem;font-weight:700;color:var(--accent);}
.header-right{display:flex;align-items:center;gap:10px;}
.lang-switcher{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:50px;padding:4px;gap:2px;}
.lang-btn{padding:5px 13px;border:none;background:transparent;color:var(--text-dim);font-family:var(--font-body);font-size:.76rem;font-weight:500;cursor:pointer;border-radius:50px;transition:var(--trans);letter-spacing:.05em;text-transform:uppercase;}
.lang-btn.active{background:var(--accent);color:var(--bg);font-weight:600;}
.lang-btn:hover:not(.active){background:var(--border);color:var(--text);}
.theme-wrap{position:relative;}
.theme-btn{display:flex;align-items:center;gap:7px;padding:8px 16px;background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);font-family:var(--font-body);font-size:.78rem;cursor:pointer;border-radius:50px;transition:var(--trans);}
.theme-btn:hover{border-color:var(--accent);color:var(--accent);}
.theme-btn svg{width:14px;height:14px;}
.theme-panel{position:absolute;top:calc(100% + 10px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;display:none;flex-direction:column;gap:8px;width:220px;z-index:999;box-shadow:0 12px 40px rgba(0,0,0,.4);}
.theme-panel.open{display:flex;}
.tp-title{font-family:var(--font-mono);font-size:.67rem;color:var(--text-dimmer);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.t-swatch{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;padding:8px 4px;border-radius:9px;border:1px solid transparent;transition:var(--trans);}
.t-swatch:hover,.t-swatch.active{border-color:var(--accent);background:var(--surface2);}
.sw-circle{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.15);}
.sw-label{font-size:.64rem;color:var(--text-dim);font-family:var(--font-mono);}
.admin-login-btn{display:flex;align-items:center;gap:7px;padding:8px 16px;background:transparent;border:1px solid var(--border);color:var(--text-dim);font-family:var(--font-body);font-size:.8rem;cursor:pointer;border-radius:50px;transition:var(--trans);}
.admin-login-btn:hover{border-color:var(--accent);color:var(--accent);}
.admin-login-btn svg{width:14px;height:14px;}

/* ══ ADMIN HEADER PANEL (replaces bottom-right bar) ══ */
.admin-header-panel{
  display:none;
  align-items:center;
  gap:8px;
  padding:6px 6px 6px 14px;
  background:rgba(0,0,0,.2);
  border:1px solid var(--accent);
  border-radius:50px;
  animation:adminIn .35s cubic-bezier(.34,1.56,.64,1) forwards;
}
.admin-header-panel.visible{display:flex;}
.admin-user-info{display:flex;flex-direction:column;line-height:1.2;}
.admin-user-label{font-family:var(--font-mono);font-size:.58rem;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;}
.admin-user-email{font-family:var(--font-mono);font-size:.65rem;color:var(--text-dim);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ahp-btn{display:flex;align-items:center;gap:5px;padding:7px 13px;border-radius:50px;font-family:var(--font-body);font-size:.78rem;cursor:pointer;transition:var(--trans);border:none;white-space:nowrap;}
.ahp-edit{background:var(--accent);color:var(--bg);font-weight:600;}
.ahp-edit:hover{opacity:.85;}
.ahp-sync{background:transparent;border:1px solid #4ecb71;color:#4ecb71;}
.ahp-sync:hover{background:rgba(78,203,113,.1);}
.ahp-logout{background:transparent;border:1px solid var(--border);color:var(--text-dimmer);padding:7px 10px;}
.ahp-logout:hover{border-color:#e87a7a;color:#e87a7a;}
.fb-dot{width:6px;height:6px;border-radius:50%;background:#4ecb71;display:inline-block;animation:fbP 2s infinite;flex-shrink:0;}

/* ══ HERO ══ */
.hero{min-height:100vh;display:flex;align-items:center;padding:120px 48px 80px;position:relative;overflow:hidden;}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 700px 600px at 75% 50%,rgba(232,200,122,.07) 0%,transparent 70%);}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:60px 60px;opacity:.3;mask-image:radial-gradient(ellipse at center,black 30%,transparent 80%);}
.hero-inner{position:relative;z-index:2;display:flex;align-items:center;gap:64px;width:100%;max-width:1100px;}
.hero-photo-wrap{flex-shrink:0;}
.hero-photo,.hero-photo-placeholder{animation:float 5s ease-in-out infinite;}
.hero-photo{width:190px;height:190px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);box-shadow:0 0 50px rgba(0,0,0,.3),0 0 0 8px rgba(0,0,0,.1),0 0 80px var(--glow);display:block;}
.hero-photo-placeholder{width:190px;height:190px;border-radius:50%;border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-dimmer);font-size:.74rem;font-family:var(--font-mono);text-align:center;}
.hero-photo-placeholder svg{width:30px;height:30px;}
.hero-content{flex:1;}
.hero-eyebrow{font-family:var(--font-mono);font-size:.76rem;color:var(--accent);letter-spacing:.16em;text-transform:uppercase;margin-bottom:22px;display:flex;align-items:center;gap:12px;}
.hero-eyebrow::before{content:'';display:block;width:40px;height:1px;background:var(--accent);}
.hero-name{font-family:var(--font-display);font-size:clamp(3rem,7vw,6.5rem);font-weight:900;line-height:.93;letter-spacing:-.025em;margin-bottom:10px;}
.hero-name .accent{
  background:linear-gradient(90deg,var(--accent) 25%,#fff8e7 50%,var(--accent) 75%);
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:shimmer 4s linear infinite;
}
.hero-subtitle{font-family:var(--font-display);font-size:clamp(1rem,2vw,1.5rem);color:var(--text-dim);font-weight:400;font-style:italic;margin-bottom:20px;margin-top:14px;}
.hero-desc{font-size:.94rem;color:var(--text-dim);line-height:1.85;max-width:540px;margin-bottom:28px;}
.hero-tags{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:32px;}
.tag{padding:5px 15px;border:1px solid var(--border);border-radius:50px;font-size:.78rem;color:var(--text-dim);font-family:var(--font-mono);transition:var(--trans);}
.tag:hover{border-color:var(--accent);color:var(--accent);}
.hero-links{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.contact-link{display:flex;align-items:center;gap:7px;color:var(--text-dim);text-decoration:none;font-size:.83rem;transition:var(--trans);padding:6px 12px;border:1px solid transparent;border-radius:50px;}
.contact-link:hover{color:var(--accent);border-color:var(--border);transform:translateY(-2px);}
.contact-link svg{width:14px;height:14px;flex-shrink:0;}
.social-link{display:flex;align-items:center;gap:7px;color:var(--text-dim);text-decoration:none;font-size:.83rem;transition:var(--trans);padding:6px 14px;border:1px solid var(--border);border-radius:50px;}
.social-link:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-2px);background:var(--glow);}
.social-link svg{width:14px;height:14px;flex-shrink:0;}
.links-div{width:1px;height:20px;background:var(--border);}

/* ══ SECTIONS ══ */
.section{padding:90px 48px;max-width:1200px;margin:0 auto;}
.section-header{display:flex;align-items:baseline;gap:20px;margin-bottom:50px;}
.section-num{font-family:var(--font-mono);font-size:.74rem;color:var(--accent);letter-spacing:.1em;}
.section-title{font-family:var(--font-display);font-size:clamp(1.8rem,3.5vw,2.6rem);font-weight:700;line-height:1;}
.section-line{flex:1;height:1px;background:var(--border);margin-left:20px;}
.section-divider{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);max-width:1200px;margin:0 auto;}

/* ══ EDUCATION ══ */
.edu-grid{display:grid;gap:18px;}
.edu-card{display:grid;grid-template-columns:auto 1fr;gap:0 26px;padding:22px 26px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);transition:var(--trans);}
.edu-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.25),0 0 0 1px var(--accent);}
.edu-year{font-family:var(--font-mono);font-size:.7rem;color:var(--accent);writing-mode:vertical-rl;letter-spacing:.1em;opacity:.7;align-self:start;margin-top:3px;}
.edu-info h3{font-family:var(--font-display);font-size:1.08rem;font-weight:700;margin-bottom:4px;}
.edu-info .school{color:var(--accent);font-size:.86rem;font-weight:500;margin-bottom:3px;}
.edu-info .eloc{font-family:var(--font-mono);font-size:.7rem;color:var(--text-dimmer);}

/* ══ PROJECTS ══ */
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;}
.project-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;position:relative;overflow:hidden;transition:var(--trans);display:flex;flex-direction:column;}
.project-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent);opacity:0;transition:opacity .3s;}
.project-card:hover{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.3);}
.project-year{display:inline-block;font-family:var(--font-mono);font-size:.69rem;color:var(--accent);background:rgba(0,0,0,.15);border:1px solid var(--border);padding:3px 10px;border-radius:50px;margin-bottom:10px;}
.project-card h3{font-family:var(--font-display);font-size:.98rem;font-weight:700;margin-bottom:9px;line-height:1.3;}
.project-card ul{list-style:none;display:flex;flex-direction:column;gap:5px;flex:1;}
.project-card li{font-size:.81rem;color:var(--text-dim);padding-left:15px;position:relative;line-height:1.5;}
.project-card li::before{content:'→';position:absolute;left:0;color:var(--accent);font-size:.69rem;top:2px;}
.project-pdf-link{display:flex;align-items:center;gap:7px;margin-top:14px;padding:8px 14px;background:rgba(0,0,0,.15);border:1px solid var(--border);border-radius:8px;color:var(--accent);font-size:.78rem;font-family:var(--font-mono);text-decoration:none;transition:var(--trans);width:fit-content;cursor:pointer;}
.project-pdf-link:hover{border-color:var(--accent);background:rgba(0,0,0,.25);}
.project-pdf-link svg{width:14px;height:14px;}

/* ══ EXPERIENCE ══ */
.exp-list{display:grid;gap:16px;}
.exp-card{display:flex;gap:20px;padding:22px 26px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);transition:var(--trans);}
.exp-card:hover{border-color:var(--accent2);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.25);}
.exp-dot{width:10px;height:10px;border-radius:50%;background:var(--accent2);margin-top:6px;flex-shrink:0;box-shadow:0 0 14px var(--accent2);}
.exp-info{flex:1;}
.exp-info h3{font-family:var(--font-display);font-size:1.03rem;font-weight:700;margin-bottom:4px;}
.exp-meta{display:flex;gap:12px;margin-bottom:9px;flex-wrap:wrap;}
.exp-company{color:var(--accent2);font-size:.84rem;font-weight:500;}
.exp-period{font-family:var(--font-mono);font-size:.7rem;color:var(--text-dimmer);}
.exp-bullets{list-style:none;display:flex;flex-direction:column;gap:5px;}
.exp-bullets li{font-size:.82rem;color:var(--text-dim);padding-left:15px;position:relative;line-height:1.5;}
.exp-bullets li::before{content:'▸';position:absolute;left:0;color:var(--accent2);}

/* ══ SKILLS ══ */
.skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;}
.skill-category{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;transition:var(--trans);}
.skill-category:hover{border-color:var(--accent3);transform:translateY(-2px);}
.skill-cat-title{font-family:var(--font-mono);font-size:.69rem;color:var(--accent3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.skill-cat-title::after{content:'';flex:1;height:1px;background:var(--border);}
.skill-tags{display:flex;flex-wrap:wrap;gap:7px;}
.skill-tag{padding:5px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;font-size:.77rem;color:var(--text-dim);transition:var(--trans);}
.skill-tag:hover{border-color:var(--accent3);color:var(--accent3);}
.skill-tag.hl{border-color:var(--accent3);color:var(--accent3);}

/* ══ CERT CARDS ══ */
.certs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;}
.cert-card{--delay:0ms;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:var(--trans);display:flex;flex-direction:column;position:relative;animation:certIn .5s ease both;animation-delay:var(--delay);}
.cert-card::after{content:'';position:absolute;inset:-1px;border-radius:var(--radius);background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3),var(--accent));background-size:300% 300%;opacity:0;z-index:0;transition:opacity .35s;animation:borderRun 4s linear infinite;}
.cert-card > *{position:relative;z-index:1;}
.cert-card:hover{transform:translateY(-5px);box-shadow:0 16px 48px rgba(0,0,0,.35);}
.cert-card:hover::after{opacity:.55;}
.cert-img-wrap{width:100%;height:180px;background:var(--surface2);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;}
.cert-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s ease;}
.cert-img-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 50%,var(--surface) 100%);pointer-events:none;}
.cert-img-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-dimmer);font-size:.74rem;font-family:var(--font-mono);width:100%;height:100%;}
.cert-img-placeholder svg{width:32px;height:32px;opacity:.5;}
.cert-img-placeholder span{opacity:.6;}
.cert-year-badge{position:absolute;top:12px;right:12px;z-index:2;font-family:var(--font-mono);font-size:.68rem;color:var(--bg);background:var(--accent);padding:4px 11px;border-radius:50px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.3);}
.cert-body{padding:18px 20px 8px;flex:1;display:flex;flex-direction:column;gap:6px;}
.cert-name{font-family:var(--font-display);font-size:1.08rem;font-weight:700;color:var(--text);line-height:1.35;}
.cert-org{font-family:var(--font-mono);font-size:.69rem;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;}
.cert-view-btn{display:flex;align-items:center;justify-content:center;gap:7px;margin:8px 20px 18px;padding:10px 16px;background:transparent;border:1px solid var(--border);border-radius:9px;color:var(--accent);font-size:.78rem;font-family:var(--font-mono);cursor:pointer;transition:var(--trans);text-decoration:none;letter-spacing:.04em;}
.cert-view-btn:hover{border-color:var(--accent);background:var(--glow);transform:translateY(-1px);}
.cert-view-btn svg{width:13px;height:13px;}
.cert-zoom-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:rgba(0,0,0,.6);border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#fff;z-index:3;transition:transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;}
.cert-img-wrap:hover .cert-zoom-icon{transform:translate(-50%,-50%) scale(1);}
.cert-zoom-icon svg{width:18px;height:18px;}

/* ══ LIGHTBOX ══ */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:9998;display:none;align-items:center;justify-content:center;padding:24px;}
.lightbox.open{display:flex;}
.lightbox img{max-width:90vw;max-height:88vh;border-radius:12px;box-shadow:0 20px 80px rgba(0,0,0,.8);}
.lightbox-close{position:absolute;top:20px;right:24px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:1.4rem;cursor:pointer;line-height:1;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;transition:var(--trans);}
.lightbox-close:hover{background:rgba(255,255,255,.2);}

/* ══ MODALS ══ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(14px);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.active{display:flex;animation:modalIn .25s ease forwards;}
.mclose{position:absolute;top:14px;right:14px;background:transparent;border:none;color:var(--text-dim);cursor:pointer;font-size:1.2rem;padding:6px;line-height:1;transition:color .2s;}
.mclose:hover{color:var(--text);}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:44px;width:100%;max-width:440px;position:relative;}

<!-- باقي المحتوى -->

<!-- التعديل الخاص بشاشة التعديل -->
<div class="modal-overlay" id="editorOverlay">
  <div class="editor-modal">
    <button class="mclose" style="top:14px;right:14px;" onclick="closeEditor()">✕</button>
    <!-- محتوى التعديل هنا -->
    <!-- ... المحتوى كما هو ... -->
  </div>
</div>

<script>
/* ══ تعديل وظيفة openEditor لإضافة الكلاس بشكل صحيح */
function openEditor(){
  // تعبئة البيانات هنا إذا لزم الأمر
  document.getElementById('editorOverlay').classList.add('active');
}
function closeEditor(){
  document.getElementById('editorOverlay').classList.remove('active');
}
// باقي الكود كما هو...
</script>
</body>
